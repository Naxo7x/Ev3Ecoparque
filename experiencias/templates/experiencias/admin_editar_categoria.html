{% extends 'base.html' %}

{% block titulo %} Editar Categoría {% endblock %}

{% block contenido %}
<div class="container-fluid">
    <h1 class="h3 mb-4 text-gray-800">Editar Categoría: {{ categoria.nombre }}</h1>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Modificar Datos</h6>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        {{ form.as_p }}

                        <button type="submit" class="btn btn-primary font-weight-bold mt-3">Actualizar Cambios</button>
                        <a href="{% url 'gestionar_categorias' %}" class="btn btn-secondary font-weight-bold mt-3 ml-2">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
