{% load static %}
<nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

    <!-- Botón Toggle en móviles -->
    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
        <i class="fa fa-bars"></i>
    </button>

    <span class="d-none d-sm-inline-block font-weight-bold text-primary ml-md-3">
        Reserva Natural & Ecoparque
    </span>

    <ul class="navbar-nav ml-auto">

        <div class="topbar-divider d-none d-sm-block"></div>
        {% if user.is_authenticated %}
            <li class="nav-item dropdown no-arrow">
                <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                    data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <span class="mr-2 d-none d-lg-inline text-gray-600 small">
                        <strong>{{ user.username }}</strong> ({{ user.perfil.get_rol_display|default:user.perfil.rol }})
                    </span>
                    <img class="img-profile rounded-circle" src="{% static 'img/undraw_profile.svg' %}">
                </a>
                
                <!-- Submenú de Usuario -->
                <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
                    aria-labelledby="userDropdown">
                    <a class="dropdown-item" href="#" data-toggle="modal" data-target="#logoutModal">
                        <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                        Cerrar Sesión
                    </a>
                </div>
            </li>
        {% else %}
            <li class="nav-item">
                <a class="btn btn-primary btn-sm font-weight-bold" href="{% url 'login' %}">
                    <i class="fas fa-sign-in-alt mr-1"></i> Iniciar Sesión
                </a>
            </li>
        {% endif %}

    </ul>

</nav>
