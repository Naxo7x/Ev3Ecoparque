{% extends 'base.html' %}
{% load static %}

{% block titulo %} Editar Usuario {% endblock %}

{% block contenido %}
<div class="container-fluid">
    <h1 class="h3 mb-4 text-gray-800">Editar Usuario: {{ perfil.user.username }}</h1>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">Modificar Rol y Estado</h6>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label class="font-weight-bold">Correo Electrónico</label>
                            <input type="text" class="form-control" value="{{ perfil.user.email }}" disabled>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold">Rol del Sistema</label>
                            <select name="rol" class="form-control">
                                <option value="ADMIN" {% if perfil.rol == 'ADMIN' %}selected{% endif %}>Administrador</option>
                                <option value="GUIA" {% if perfil.rol == 'GUIA' %}selected{% endif %}>Guía</option>
                                <option value="Cliente" {% if perfil.rol == 'Cliente' %}selected{% endif %}>Cliente</option>
                            </select>
                        </div>

                        <div class="form-group form-check mt-3">
                            <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if perfil.user.is_active %}checked{% endif %}>
                            <label class="form-check-label font-weight-bold" for="is_active">Usuario Activo</label>
                        </div>

                        <button type="submit" class="btn btn-success btn-block font-weight-bold mt-4">Guardar Cambios</button>
                        <a href="{% url 'lista_usuarios' %}" class="btn btn-secondary btn-block mt-2">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
